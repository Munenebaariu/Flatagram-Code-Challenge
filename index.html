<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flatagram</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Flatagram</h1>

    <section id="image-section">
      <h2 id="title">Loading title...</h2>
      <img id="image" src="" alt="Flatagram photo" width="400" />
      <p>❤️ <span id="likes">0</span> likes</p>
    </section>

    <section id="comments-section">
      <h3>Comments</h3>
      <ul id="comments-list">
        <li>Loading comments...</li>
      </ul>

      <form id="comment-form">
        <input type="text" id="comment-input" placeholder="Add a comment..." required />
        <button type="submit">Post</button>
      </form>
    </section>

    <script src="index.js"></script>
  </body>
</html>
